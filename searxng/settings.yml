# SearXNG config for Firecrawl /search (JSON API + a few reliable engines).
use_default_settings: true

server:
  secret_key: "mnemonic-dev-searxng-change-me"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  default_lang: "en"
  formats:
    - html
    - json

engines:
  - name: brave
    engine: brave
    disabled: false
  - name: bing
    engine: bing
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    disabled: false
