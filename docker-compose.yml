services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: mnemonic
      POSTGRES_USER: mnemonic
      POSTGRES_PASSWORD: mnemonic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemonic -d mnemonic"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.3
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: "${S3_ACCESS_KEY_ID:-rustfsadmin}"
      RUSTFS_SECRET_KEY: "${S3_SECRET_ACCESS_KEY:-rustfsadmin}"
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data

  rustfs-init:
    image: minio/mc:latest
    profiles: ["init"]
    environment:
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-rustfsadmin}"
      S3_BUCKET: "${S3_BUCKET:-mnemonic-files}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-rustfsadmin}"
    depends_on:
      - rustfs
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://rustfs:9000 \"$${S3_ACCESS_KEY_ID}\" \"$${S3_SECRET_ACCESS_KEY}\"; do
        sleep 1;
      done;
      mc mb --ignore-existing \"local/$${S3_BUCKET}\";
      "

  searxng:
    image: searxng/searxng:2026.8.22-9fea41204
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    networks:
      - firecrawl
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
      start_interval: 1s

  redis:
    image: valkey/valkey:9.1-alpine
    command: redis-server --bind 0.0.0.0 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  firecrawl-redis:
    image: valkey/valkey:9.1-alpine
    networks:
      - firecrawl
    command: redis-server --bind 0.0.0.0

  firecrawl-rabbitmq:
    image: rabbitmq:3.13-alpine
    networks:
      - firecrawl
    volumes:
      - firecrawl_rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: firecrawl
      RABBITMQ_DEFAULT_PASS: firecrawl
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
      start_interval: 1s

  firecrawl-nuq-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    command: postgres -c cron.database_name=firecrawl
    environment:
      POSTGRES_DB: firecrawl
      POSTGRES_USER: firecrawl
      POSTGRES_PASSWORD: firecrawl
    networks:
      - firecrawl
    volumes:
      - firecrawl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firecrawl -d firecrawl"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    environment:
      PORT: 3000
      BLOCK_MEDIA: "false"
      ALLOW_LOCAL_WEBHOOKS: "false"
      MAX_CONCURRENT_PAGES: 5
    networks:
      - firecrawl

  firecrawl-api:
    image: ghcr.io/firecrawl/firecrawl:2.11.234
    ports:
      - "4010:3002"
    networks:
      - firecrawl
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      HOST: "0.0.0.0"
      PORT: 3002
      USE_DB_AUTHENTICATION: "false"
      LOGGING_LEVEL: info
      BULL_AUTH_KEY: mnemonic-dev-bull-auth
      BLOCK_MEDIA: "false"
      ALLOW_LOCAL_WEBHOOKS: "false"
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
      SEARXNG_ENDPOINT: http://searxng:8080
      POSTGRES_HOST: firecrawl-nuq-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: firecrawl
      POSTGRES_USER: firecrawl
      POSTGRES_PASSWORD: firecrawl
      NUQ_RABBITMQ_URL: amqp://firecrawl:firecrawl@firecrawl-rabbitmq:5672
      NUM_WORKERS_PER_QUEUE: 4
      CRAWL_CONCURRENT_REQUESTS: 5
      MAX_CONCURRENT_JOBS: 3
      BROWSER_POOL_SIZE: 3
      MAX_CPU: "0.9"
      MAX_RAM: "0.9"
    depends_on:
      firecrawl-redis:
        condition: service_started
      firecrawl-playwright:
        condition: service_started
      firecrawl-nuq-postgres:
        condition: service_healthy
      firecrawl-rabbitmq:
        condition: service_healthy
      searxng:
        condition: service_healthy
    command: ["node", "dist/src/harness.js", "--start-docker"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3002/v0/health/liveness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

networks:
  firecrawl:
    driver: bridge

volumes:
  postgres_data:
  rustfs_data:
  redis_data:
  firecrawl_rabbitmq_data:
  firecrawl_postgres_data:
